
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar Akun - SnackMarket</title>

    <link rel="stylesheet" href="../CSS/daftar.css">
</head>
<body>

    <div class="register-container">

        <div class="register-box">

            <div class="register-header">
                <h1>SnackMarket</h1>
                <h2>Buat Akun Baru</h2>
                <p>Daftar untuk mulai memesan makanan favoritmu.</p>
            </div>

            <form id="formRegister">

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text"
                           id="nama"
                           placeholder="Masukkan nama lengkap"
                           required>
                </div>

                <div class="form-group">
                    <label for="emailRegister">Email</label>
                    <input type="email"
                           id="emailRegister"
                           placeholder="Masukkan email"
                           required>
                </div>

                <div class="form-group">
                    <label for="teleponRegister">Nomor Telepon</label>
                    <input type="tel"
                           id="teleponRegister"
                           placeholder="Masukkan nomor telepon"
                           required>
                </div>

                <div class="form-group">
                    <label for="passwordRegister">Password</label>
                    <input type="password"
                           id="passwordRegister"
                           placeholder="Buat password"
                           required>
                </div>

                <div class="form-group">
                    <label for="konfirmasiPassword">Konfirmasi Password</label>
                    <input type="password"
                           id="konfirmasiPassword"
                           placeholder="Ulangi password"
                           required>
                </div>

                <p id="pesanRegister"></p>

                <button type="submit" class="btn-register">
                    Daftar Sekarang
                </button>

            </form>

            <div class="register-footer">
                <p>Sudah punya akun?</p>
                <a href="login.html">Login Sekarang</a>
            </div>

            <div class="back-home">
                <a href="../index.html">&larr; Kembali ke Beranda</a>
            </div>

        </div>

    </div>

    <script src="../JavaScript/index.js"></script>

</body>
</html>
