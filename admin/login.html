
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin - SnackMarket</title>

    <link rel="stylesheet" href="../CSS/loginn.css">
</head>
<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <span>Snack</span>Market
            </div>

            <div class="admin-icon">
                👨‍💼
            </div>

            <h2>Login Admin</h2>

            <p class="subtitle">
                Silakan masuk untuk mengelola SnackMarket.
            </p>

            <form id="formLoginAdmin">

                <div class="form-group">
                    <label for="username">Username Admin</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        required
                    >
                </div>

                <p id="pesanLogin"></p>

                <button type="submit">
                    Masuk sebagai Admin
                </button>

            </form>

            <a href="../index.html" class="kembali">
                ← Kembali ke Beranda
            </a>

        </div>

    </div>

    <script src="../JavaScript/admin.js"></script>

</body>
</html>
